{% extends 'core/base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">ASSET MANAGEMENT</p><h1>{{title}}</h1><p>Add accurate details to keep operations moving.</p></div></div><section class="panel form-panel"><div class="form-icon"><i class="bi {{icon}}"></i></div><form method="post" class="row g-3">{% csrf_token %}{% for field in form %}<div class="col-md-6"><label class="form-label">{{field.label}}</label>{{field}}{% for error in field.errors %}<small class="text-danger">{{error}}</small>{% endfor %}</div>{% endfor %}<div class="col-12 mt-4"><a class="btn btn-light" href="javascript:history.back()">Cancel</a><button class="btn btn-primary ms-2">Save changes <i class="bi bi-check2"></i></button></div></form></section>{% endblock %}
