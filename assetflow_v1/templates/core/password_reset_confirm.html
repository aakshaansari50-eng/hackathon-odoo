{% load static %}<!doctype html><html><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{% static 'css/app.css' %}" rel="stylesheet"></head><body class="auth-page"><section class="auth-aside"><a class="brand">Asset<span>Flow</span></a></section><section class="auth-main"><form method="post" class="auth-card">{% csrf_token %}<h2>Choose a new password</h2>{% for field in form %}<label>{{field.label}}</label>{{field}}{% for error in field.errors %}<small class="text-danger">{{error}}</small>{% endfor %}{% endfor %}<button class="btn btn-primary w-100 mt-4">Update password</button></form></section></body></html>
